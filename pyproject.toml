[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fdsvis"
version = "6.0.0"
description = "Junior Fire Scientist -- an interactive educational application for exploring fire science through real FDS simulations"
requires-python = ">=3.9"
dependencies = [
    "PyQt5==5.15.*",
    "matplotlib>=3.8,<3.9",
    "numpy>=1.26,<2",
    "scikit-learn>=1.3,<1.4",
    "scipy>=1.11,<1.12",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
fdsvis = "main:main"
fdsvis-cli = "cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["fds", "fds.slice", "analytics", "cinema", "controls", "pages", "public"]
py-modules = [
    "advanced_compare",
    "advanced_compare_panel",
    "analysis_panel_base",
